name: food_delivery_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  flutter:
    sdk: flutter
  google_sign_in: ^6.3.0
  http: ^1.3.0
  path: ^1.9.1
  provider: ^6.1.2
  sqflite: ^2.4.2
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
